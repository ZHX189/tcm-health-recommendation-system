server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由 history 模式支持(刷新不 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反代(/api/admin → tcm-api-admin:8083)
    # 第二阶段部署到 k8s 后,把 tcm-api-admin 换成对应的 k8s Service 名即可
    location /api/admin/ {
        proxy_pass http://tcm-api-admin:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传文件访问反代(图片回显走 /uploads/)
    location /uploads/ {
        proxy_pass http://tcm-api-admin:8083;
        proxy_set_header Host $host;
    }
}
